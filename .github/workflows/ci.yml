name: Project Prometheus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Secret Scanning & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Secretlint (Security Scan)
        run: npm run lint:secrets

      - name: Run Client Lint
        run: npm --prefix client run lint

      - name: Run Regression Tests
        run: node --test client/tests/*.test.mjs server/*.test.js

      - name: Build Frontend Client (Typecheck & Vite)
        run: npm run build

      - name: Validate Server Runtime
        run: |
          node -e "const app = require('./server/index.js'); console.log('Server module loaded OK');"

