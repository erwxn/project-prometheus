services:
  api:
    image: prometheus-api:local
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 5000
      HARMONIZED_LOCAL_FILE: /app/test-data/harmonized/delivery_2014_morocco.zip
      HARMONIZED_SOURCE_NAME: Morocco 2014 - bundled historical preview
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 15s
  web:
    image: prometheus-web:local
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 60s
      timeout: 5s
      retries: 3
